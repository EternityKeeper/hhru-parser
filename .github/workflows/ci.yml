name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  python-lint:
    name: Python lint & SAST
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python-analyzer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install ruff pip-audit
          pip install -r requirements.txt
      - name: Ruff check (SAST)
        run: ruff check src/ tests/
      - name: pip-audit (dependency check)
        continue-on-error: true
        run: pip-audit

  python-test:
    name: Python tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python-analyzer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        run: pytest tests/ -v --tb=short

  go-lint:
    name: Go lint & SAST
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go-scraper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: go-scraper

  go-test:
    name: Go tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go-scraper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Run tests
        run: go test ./internal/... -v

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker compose build
